name: kio
description: A modern fullscreen mobile MMD player/exporter prototype.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  file_picker: ^8.1.7
  google_fonts: ^6.2.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
